refresh_sources:
  name: Refresh Sources
  description: Re-read the AV inputs (the Source dropdown) and the TV channel lists from the Loewe TV, e.g. after a channel scan or renaming an input.
  target:
    entity:
      integration: loewe
      domain: media_player

channel_up:
  name: Channel Up
  description: Step up to the next available TV channel.
  target:
    entity:
      integration: loewe
      domain: media_player

channel_down:
  name: Channel Down
  description: Step down to the previous available TV channel.
  target:
    entity:
      integration: loewe
      domain: media_player


record:
  name: Record
  description: >-
    Programme a recording on the TV's built-in DR+ recorder. Give either a programme (the current or
    next one on the tuned channel, timed from the TV's guide) or a start time with an end time or
    duration. Timers can't be cancelled from Home Assistant; use the TV's timer list.
  target:
    entity:
      integration: loewe
      domain: media_player
  fields:
    programme:
      name: Programme
      description: Record the current or the next programme, on the channel given or the one the TV is showing.
      example: next
      selector:
        select:
          options:
            - current
            - next
    channel:
      name: Channel
      description: Channel name, favourite number or locator, for a recording at a set time. Defaults to the channel the TV is showing.
      example: BBC TWO
      selector:
        text:
    start:
      name: Start
      description: When to start recording (local time).
      selector:
        datetime:
    end:
      name: End
      description: When to stop recording. Give this or a duration.
      selector:
        datetime:
    duration:
      name: Duration
      description: How long to record. Give this or an end time.
      selector:
        duration:
    repeat:
      name: Repeat
      description: >-
        Repeat the recording at this time every weekday (Mon-Fri) or every day. Weekly and series
        recordings can only be set on the TV.
      selector:
        select:
          options:
            - weekdays
            - daily

get_guide:
  name: Get guide
  description: >-
    Return the programmes on a channel from the TV's own guide, starting with the one on now.
    Reads from the first targeted TV.
  target:
    entity:
      integration: loewe
      domain: media_player
  fields:
    channel:
      name: Channel
      description: Channel name, favourite number or locator. Defaults to the channel the TV is showing.
      example: BBC TWO
      selector:
        text:
    hours:
      name: Hours
      description: How far ahead to list programmes (the TV's guide covers about a week).
      default: 24
      selector:
        number:
          min: 0.5
          max: 192
          step: 0.5
          unit_of_measurement: h
