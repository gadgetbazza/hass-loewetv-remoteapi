refresh_sources:
  name: Refresh Sources
  description: Re-read the list of AV inputs (the Source dropdown) from the Loewe TV, e.g. after renaming an input on the TV.
  target:
    entity:
      integration: loewe
      domain: media_player

channel_up:
  name: Channel Up
  description: Step up to the next available TV channel.
  target:
    entity:
      integration: loewe
      domain: media_player

channel_down:
  name: Channel Down
  description: Step down to the previous available TV channel.
  target:
    entity:
      integration: loewe
      domain: media_player

