name: Auto HACS Release

on:
  push:
    tags:
      - 'v*.*.*'  # version tags like v1.0.0 ...
      - '[0-9]*.[0-9]*.[0-9]*'  # ... or 1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required to generate changelog

      - name: Extract version from tag
        id: get_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      # HACS installs the tagged code, so the manifest must already carry the
      # version at the tagged commit. Bump manifest.json before tagging.
      - name: Check manifest.json version matches tag
        run: |
          MANIFEST_VERSION=$(jq -r .version custom_components/loewe/manifest.json)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($VERSION). Bump the manifest, commit, then tag."
            exit 1
          fi

      - name: Generate changelog from commits
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, using all commits."
            git log --pretty=format:"- %s" > CHANGELOG.txt
          else
            git log $LAST_TAG..HEAD --pretty=format:"- %s" > CHANGELOG.txt
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Loewe TV Remote API ${{ env.VERSION }}"
          body: |
            🆕 **Version:** ${{ env.VERSION }}

            This release was automatically generated for HACS.

            **Changelog:**
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
